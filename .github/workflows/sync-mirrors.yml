name: 同步镜像（Gitee / GitCode）

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送 Gitee 镜像
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -o pipefail
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/choosesheng/rikkahub-agents.git"
          git push gitee HEAD:master --force 2>&1 | tee -a sync.log
          git remote remove gitee

      - name: 推送 GitCode 镜像
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -o pipefail
          git remote add gitcode "https://oauth2:${GITCODE_TOKEN}@gitcode.com/xiwanhao/rikkahub-agents.git"
          git push gitcode HEAD:master --force 2>&1 | tee -a sync.log
          git remote remove gitcode

      - name: 上传同步日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log
          path: sync.log
          retention-days: 7
          if-no-files-found: ignore
