name: CodeQL

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  schedule:
    # 每周一 03:17（错峰，避开构建高峰）
    - cron: '17 3 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['java-kotlin']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 准备构建环境
        uses: ./.github/actions/setup-build-env

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # CodeQL 需要一个可编译的构建；这里只编译 Debug、跳过测试以缩短耗时。
      # 构建失败不阻断分析（部分代码仍可被分析），但失败必须可见：
      # 之前是 `|| true` 静默吞掉，构建每次失败、分析库缺 :app:/:web: 也没人知道。
      - name: Build (compile only)
        run: |
          set +e
          ./gradlew :app:assembleDebug -x test -x lint --no-daemon
          BUILD_EXIT=$?
          if [ "$BUILD_EXIT" != "0" ]; then
            echo "::warning::CodeQL 构建失败（退出码 $BUILD_EXIT），分析库不完整"
          fi
          exit 0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
