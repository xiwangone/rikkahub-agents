name: 00 编译 APK（push 自动 Debug）

# push 到 master 自动构建 Debug APK 并上传构建产物。
# 与 01-build.yml 分工：这里只出 Debug（不签名、不做 R8），正式 Release 仍走 01 手动入口。

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 记录本次提交
        run: |
          printf 'ref=%s\ncommit=%s\nbuild_type=debug\n' "$GITHUB_REF" "$(git rev-parse HEAD)" | tee build-ref.txt
          cat build-ref.txt >> "$GITHUB_STEP_SUMMARY"

      - name: 准备构建环境
        uses: ./.github/actions/setup-build-env

      - name: 构建 Debug APK（日志落盘）
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log

      # 放在 APK 上传之前：构建失败时 APK 不存在，但日志与报告必须能拿到，
      # 否则只能翻 Actions 网页逐行找错。
      - name: 上传构建日志与报告（失败也能取）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-debug-${{ github.sha }}
          path: |
            build-debug.log
            app/build/reports/**
            build/reports/**
            **/build/outputs/logs/**
          retention-days: 14
          if-no-files-found: warn

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
