name: 编译 APK · Release

on:
  workflow_dispatch:
    inputs:
      nothing:
        description: '手动触发编译（不发版；发版走 release.yml 工作流，版本号由发版输入控制）'
        required: false
        type: boolean
        default: false
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: Ktlint 静态检查（不阻断，输出风格报告）
        run: |
          # 固定版本避免每次下载 latest 波动
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          ./ktlint app/src/main/java 2>&1 | tail -30 || true

      - name: 缓存 Gradle 依赖（libs 变化才重建）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: 缓存 Gradle 构建缓存（固定 key，不堆积）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache
          save-always: true

      - name: 安装 bun & pnpm
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          npm install -g pnpm

      - name: 缓存 web-ui 依赖（bun.lock 变化才重建）
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          key: webui-${{ hashFiles('bun.lock') }}
          restore-keys: webui-

      - name: 固定签名构建 (overwrite-install)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE="$HOME/rikkahub.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "storeFile=$KEYSTORE" >> local.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
          echo "keyAlias=$KEY_ALIAS" >> local.properties
          echo "keyPassword=$KEY_PASSWORD" >> local.properties
          chmod +x gradlew
          # --build-cache 复用本地构建缓存；--configuration-cache 增量配置解析
          ./gradlew assembleRelease --parallel --build-cache --configuration-cache

      - name: 编译单元测试（验证测试代码可编译，不执行）
        run: |
          ./gradlew compileDebugUnitTestKotlin --parallel --build-cache --configuration-cache || true

      - name: 重命名 APK（统一命名：RikkaHub-Agents-版本号-架构-release）
        run: |
          cd app/build/outputs/apk/release
          VER=$(awk -F'\"' '/versionName/{print $2; exit}' ../../../../../app/build.gradle.kts || echo 0.0)
          for apk in *.apk; do
            case "$apk" in
              *arm64*) arch="arm64-v8a" ;;
              *universal*) arch="universal" ;;
              *) arch="$(basename "$apk" .apk)" ;;
            esac
            mv "$apk" "RikkaHub-Agents-${VER}-${arch}-release.apk"
          done
          ls -la
          echo "版本号: ${VER}"

      - name: 上传 APK (artifact)
        # 先保产物：发版（下一步）失败也不丢 APK；artifact 永远存在供下载实测
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-release
          path: app/build/outputs/apk/release/*.apk

      - name: Telegram 构建通知
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then EMOJI="✅"; else EMOJI="❌"; fi
          MSG="${EMOJI} RikkaHub Agents 构建 ${STATUS}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}
          ${URL}" || true

      - name: 构建失败通知（Server）
        if: failure()
        env:
          SC_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -z "$SC_KEY" ]; then
            echo "未配置 SERVERCHAN_KEY，跳过通知"
            exit 0
          fi
          MSG="RikkaHub Agents 构建失败 #${{ github.run_number }}"
          DESP="commit: ${{ github.sha }}%0A%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://sctapi.ftqq.com/${SC_KEY}.send" \
            -d "title=${MSG}" -d "desp=${DESP}" | head -c 200
          echo
