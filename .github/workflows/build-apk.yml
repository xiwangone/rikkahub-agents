name: 编译 APK · Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '自定义 Release tag（默认取 versionName，如 2.4.5-beta.1）'
        required: false
        type: string
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: Ktlint 静态检查（不阻断，输出风格报告）
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/latest/download/ktlint
          chmod +x ktlint
          ./ktlint app/src/main/java 2>&1 | tail -30 || true

      - name: 缓存 Gradle（依赖/编译缓存，加速构建）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 安装 bun & pnpm
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          npm install -g pnpm

