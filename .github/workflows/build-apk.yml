name: 编译 APK · CI 验证

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '编译类型：debug（快速验证，默认） / release（R8 全量，慢）'
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: Ktlint 静态检查（不阻断，输出风格报告）
        run: |
          # 固定版本避免每次下载 latest 波动
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          ./ktlint app/src/main/java 2>&1 | tail -30 || true

      - name: 缓存 Gradle 依赖（libs 变化才重建）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: 缓存 Gradle 构建缓存（固定 key，不堆积）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache
          save-always: true

      - name: 安装 bun & pnpm
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          npm install -g pnpm

      - name: 缓存 web-ui 依赖（bun.lock 变化才重建）
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          key: webui-${{ hashFiles('bun.lock') }}
          restore-keys: webui-

      - name: 选择编译类型
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "task=debug" >> $GITHUB_OUTPUT
            echo "触发方式: push → assembleDebug（快速编译验证，5-10 分钟，不开 R8）"
          else
            echo "task=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
            echo "触发方式: workflow_dispatch → ${{ inputs.build_type }}"
          fi

      - name: 编译（push=debug 快速验证 / 手动可选 release）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TASK="${{ steps.pick.outputs.task }}"
          if [ "$TASK" = "release" ]; then
            KEYSTORE="$HOME/rikkahub.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "storeFile=$KEYSTORE" >> local.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
            echo "keyAlias=$KEY_ALIAS" >> local.properties
            echo "keyPassword=$KEY_PASSWORD" >> local.properties
            chmod +x gradlew
            ./gradlew assembleRelease --parallel --build-cache --configuration-cache
          else
            chmod +x gradlew
            # debug 不签名不发版，仅验证编译通过
            ./gradlew assembleDebug --parallel --build-cache --configuration-cache
          fi

      - name: 编译单元测试（验证测试代码可编译，不执行）
        if: ${{ steps.pick.outputs.task == 'release' }}
        run: |
          ./gradlew compileDebugUnitTestKotlin --parallel --build-cache --configuration-cache || true

      - name: 重命名 APK（release 才保留产物）
        if: ${{ steps.pick.outputs.task == 'release' }}
        run: |
          cd app/build/outputs/apk/release
          VER=$(awk -F'\"' '/versionName/{print $2; exit}' ../../../../../app/build.gradle.kts || echo 0.0)
          for apk in *.apk; do
            case "$apk" in
              *arm64*) arch="arm64-v8a" ;;
              *universal*) arch="universal" ;;
              *) arch="$(basename "$apk" .apk)" ;;
            esac
            mv "$apk" "RikkaHub-Agents-${VER}-${arch}-release.apk"
          done
          ls -la
          echo "版本号: ${VER}"

      - name: 上传 APK (artifact, release 才上传)
        if: ${{ steps.pick.outputs.task == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-release
          path: app/build/outputs/apk/release/*.apk

