name: 编译 APK（验证 / 出包）

# 合并自 build-debug.yml（push master 自动快速验证）与 build-apk.yml（手动触发，可选 release 出包）。
# 手动出包：Actions → 本 workflow → Run workflow → build_type = debug | release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: '编译类型：debug（快速验证，默认） / release（R8 全量正式签名出包，慢）'
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

concurrency:
  group: build-${{ github.ref }}-${{ inputs.build_type || 'debug' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: Ktlint 静态检查（不阻断，输出风格报告）
        run: |
          # 固定版本避免每次下载 latest 波动
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          ./ktlint app/src/main/java 2>&1 | tail -30 || true

      - name: 缓存 Gradle 依赖（libs 变化才重建）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: 缓存 Gradle 构建缓存（固定 key，不堆积）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache
          save-always: true

      - name: 安装 bun（多源回退：npm → 官方安装脚本）
        run: |
          set +e
          npm install -g bun && echo "bun installed via npm" && exit 0
          curl -fsSL https://bun.sh/install | bash && echo "$HOME/.bun/bin" >> $GITHUB_PATH && echo "bun installed via installer" && exit 0
          echo "bun installation failed on all sources" && exit 1

      - name: 安装 pnpm（多源回退：corepack → npm）
        run: |
          set +e
          corepack enable && corepack prepare pnpm@latest --activate && echo "pnpm activated via corepack" && exit 0
          npm install -g pnpm && echo "pnpm installed via npm" && exit 0
          echo "pnpm installation failed on all sources" && exit 1

      - name: 缓存 web-ui 依赖（bun.lock 变化才重建）
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          key: webui-${{ hashFiles('web-ui/bun.lock') }}
          restore-keys: webui-

      - name: 编译（debug=快速验证 / release=R8 正式签名出包）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "release" ]; then
            KEYSTORE="$HOME/rikkahub.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "storeFile=$KEYSTORE" >> local.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
            echo "keyAlias=$KEY_ALIAS" >> local.properties
            echo "keyPassword=$KEY_PASSWORD" >> local.properties
            ./gradlew assembleRelease --parallel --build-cache --configuration-cache
          else
            # debug 不签名不发版，仅验证编译通过
            ./gradlew assembleDebug --parallel --build-cache --configuration-cache
          fi

      - name: 编译单元测试代码（仅验证可编译，不执行）
        if: env.BUILD_TYPE == 'debug'
        run: ./gradlew compileDebugUnitTestKotlin --parallel --build-cache --configuration-cache || true

      - name: 上传 APK（debug，可做破坏性测试）
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/*/debug/*.apk
          retention-days: 14

      - name: 上传 APK（release）
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/*/release/*.apk

