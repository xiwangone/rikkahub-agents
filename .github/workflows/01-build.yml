name: 01 编译 APK（验证 / 出包）

# 合并自 build-debug.yml（push master 自动快速验证）与 build-apk.yml（手动触发，可选 release 出包）。
# 手动出包：Actions → 本 workflow → Run workflow → build_type = debug | release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: '编译类型：debug（快速验证，默认） / release（R8 全量正式签名出包，慢）'
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

concurrency:
  group: build-${{ github.ref }}-${{ inputs.build_type || 'debug' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 准备构建环境
        uses: ./.github/actions/setup-build-env
      - name: Ktlint 静态检查（不阻断，输出风格报告）
        run: |
          # 固定版本避免每次下载 latest 波动
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          ./ktlint app/src/main/java 2>&1 | tail -30 || true

      - name: 未使用 import 守卫（只拦增长，不拦存量）
        run: |
          # 风格存量（约 2.6 万条）有意不阻断，见上一步；这里只把「未使用 import」这类零风险
          # 死代码拦住不增长。基线就是一个数字：.github/ktlint-unused-imports.baseline。
          # 清理后请同步下调；把该文件清空则守卫自动暂停（只报告）。
          COUNT=$(./ktlint app/src/main/java 2>&1 | grep -c 'no-unused-imports' || true)
          echo "未使用 import 告警数: ${COUNT:-0}"
          if [ -s .github/ktlint-unused-imports.baseline ]; then
            LIMIT=$(tr -dc '0-9' < .github/ktlint-unused-imports.baseline)
            if [ "${COUNT:-0}" -gt "$LIMIT" ]; then
              echo "❌ 未使用 import 由 $LIMIT 增至 ${COUNT}：请清理新增项（ktlint -F 可自动删除）"
              exit 1
            fi
            echo "✅ 未超过基线 $LIMIT"
          else
            echo "ℹ️ 基线文件为空或缺失 → 本轮仅报告（写入数字即启用守卫）"
          fi

      - name: 缓存 Gradle 依赖（libs 变化才重建）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: 缓存 Gradle 构建缓存（固定 key，不堆积）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache
          save-always: true

      - name: 缓存 web-ui 依赖（bun.lock 变化才重建）
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          key: webui-${{ hashFiles('web-ui/bun.lock') }}
          restore-keys: webui-

      - name: 编译（debug=快速验证 / release=R8 正式签名出包）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          set +e   # 关掉 -e：失败要自己接管，否则第一次失败就退出、根本没机会重试
          # 依赖下载受网络抽风影响 → 失败重试一次（编译错误重试无用，代价只是多等一轮）
          if [ "$BUILD_TYPE" = "release" ]; then
            KEYSTORE="$HOME/rikkahub.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "storeFile=$KEYSTORE" >> local.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
            echo "keyAlias=$KEY_ALIAS" >> local.properties
            echo "keyPassword=$KEY_PASSWORD" >> local.properties
            for i in 1 2; do
              ./gradlew assembleRelease --parallel --build-cache --configuration-cache 2>&1 | tee gradle-build.log
              [ "${PIPESTATUS[0]}" = "0" ] && break
              if [ "$i" = "2" ]; then echo "❌ 两次均失败"; exit 1; fi
              echo "⚠️ 第 $i 次失败（可能是依赖下载超时），10 秒后重试…"; sleep 10
            done
          else
            # debug 不签名不发版，仅验证编译通过
            for i in 1 2; do
              ./gradlew assembleDebug --parallel --build-cache --configuration-cache 2>&1 | tee gradle-build.log
              [ "${PIPESTATUS[0]}" = "0" ] && break
              if [ "$i" = "2" ]; then echo "❌ 两次均失败"; exit 1; fi
              echo "⚠️ 第 $i 次失败（可能是依赖下载超时），10 秒后重试…"; sleep 10
            done
          fi

      - name: 编译单元测试代码（仅验证可编译，不执行）
        if: env.BUILD_TYPE == 'debug'
        run: ./gradlew compileDebugUnitTestKotlin --parallel --build-cache --configuration-cache || true

      - name: 上传编译日志（完整 gradle 输出）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gradle-build.log
          retention-days: 14

      - name: 上传 APK（debug，可做破坏性测试）
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/*/debug/*.apk
          retention-days: 14

      - name: 上传 APK（release）
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/*/release/*.apk

