name: 01 编译 APK（正式 Release 出包）

# 正式 APK 唯一入口：手动选择 build_type=release。
# 编译/JVM 回归由 tests.yml 执行；不再自动或手动构建 Debug APK。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '正式 Release（R8 全量签名出包）'
        required: true
        type: choice
        options:
          - release
        default: release

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_TYPE: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 记录本次待验证 ref 与精确提交（不改分支、不发布 Release）
        run: |
          printf 'ref=%s\ncommit=%s\nbuild_type=release\n' "$GITHUB_REF" "$(git rev-parse HEAD)" | tee build-ref.txt
          cat build-ref.txt >> "$GITHUB_STEP_SUMMARY"

      - name: 准备构建环境
        uses: ./.github/actions/setup-build-env
      - name: 校验移植新增资源的七语言覆盖（静态检查）
        run: python3 .github/scripts/check-port-resources.py
      - name: 执行移植定向 JVM 回归（不是仅编译，也不替代 Android 验收）
        run: python3 .github/scripts/run-port-regressions.py
      - name: 上传移植回归执行证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-jvm-regressions
          path: port-regression-results/
          retention-days: 14
          if-no-files-found: error
      - name: 审计本次测试进程的 TLS 信任库
        env:
          LC_ALL: C
        run: python3 .github/scripts/audit-test-tls-trust.py
      - name: 上传 TLS 信任库审计证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tls-trust-audit
          path: tls-trust-audit.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Ktlint 静态检查（不阻断，输出风格报告）
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          ./ktlint app/src/main/java 2>&1 | tail -30 || true

      - name: 未使用 import 守卫（只拦增长，不拦存量）
        run: |
          COUNT=$(./ktlint app/src/main/java 2>&1 | grep -c 'no-unused-imports' || true)
          echo "未使用 import 告警数: ${COUNT:-0}"
          if [ -s .github/ktlint-unused-imports.baseline ]; then
            LIMIT=$(tr -dc '0-9' < .github/ktlint-unused-imports.baseline)
            if [ "${COUNT:-0}" -gt "$LIMIT" ]; then
              echo "未使用 import 由 $LIMIT 增至 ${COUNT}：请清理新增项"
              exit 1
            fi
            echo "未超过基线 $LIMIT"
          else
            echo "基线文件为空或缺失，本轮仅报告"
          fi

      - name: 缓存 Gradle 依赖（libs 变化才重建）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: 缓存 Gradle 构建缓存（固定 key，不堆积）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache
          save-always: true

      - name: 缓存 web-ui 依赖（锁文件 / 依赖清单变化才重建）
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          key: webui-${{ hashFiles('web-ui/pnpm-lock.yaml', 'web-ui/package.json') }}
          restore-keys: webui-

      - name: 编译 Release（R8 正式签名出包）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test "$BUILD_TYPE" = release
          chmod +x gradlew
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/rikkahub.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "storeFile=$KEYSTORE" >> local.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
          echo "keyAlias=$KEY_ALIAS" >> local.properties
          echo "keyPassword=$KEY_PASSWORD" >> local.properties
          set +e
          for i in 1 2; do
            ./gradlew assembleRelease --parallel --build-cache --configuration-cache 2>&1 | tee gradle-build.log
            [ "${PIPESTATUS[0]}" = "0" ] && break
            if [ "$i" = "2" ]; then echo "两次均失败"; exit 1; fi
            echo "第 $i 次失败，10 秒后重试"; sleep 10
          done

      - name: 记录正式 APK 身份、签名与混淆映射
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p release-evidence
          cp build-ref.txt release-evidence/
          find app/build/outputs/apk -type f -name '*.apk' -path '*/release/*' -print0 | while IFS= read -r -d '' apk; do
            name=$(basename "$apk")
            sha256sum "$apk" | tee "release-evidence/$name.sha256"
            "$TOOLS/aapt" dump badging "$apk" > "release-evidence/$name.badging.txt"
            "$TOOLS/apksigner" verify --verbose --print-certs "$apk" > "release-evidence/$name.signature.txt"
          done
          test -s app/build/outputs/mapping/release/mapping.txt
          cp app/build/outputs/mapping/release/mapping.txt release-evidence/
          sha256sum release-evidence/mapping.txt > release-evidence/mapping.txt.sha256
          head -20 release-evidence/mapping.txt > release-evidence/mapping-header.txt

      - name: 上传正式产物身份与 mapping（不创建 GitHub Release）
        uses: actions/upload-artifact@v4
        with:
          name: release-identity-and-mapping
          path: release-evidence/
          retention-days: 14
          if-no-files-found: error

      - name: 上传编译日志与精确 ref
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            gradle-build.log
            build-ref.txt
          retention-days: 14

      - name: 上传 APK（release）
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/*/release/*.apk
          retention-days: 14
          if-no-files-found: error
