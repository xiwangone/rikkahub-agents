name: 安全扫描（密钥 / 依赖漏洞 / 依赖变更审查）

# 合并自 secret-scan.yml + dependency-scan.yml + dependency-review.yml：
# - gitleaks：push / PR 全量扫描密钥泄漏
# - osv-scanner：push / PR / 每周定时扫描依赖漏洞（4 个锁文件）
# - dependency-review：仅 PR，审查依赖变更（fail-on-severity: high）

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks（密钥扫描）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for range scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 仅作为检查门禁；不在 PR 里发评论，避免噪声
          GITLEAKS_ENABLE_COMMENTS: false

  osv-scan:
    name: osv-scanner（依赖漏洞）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 获取 osv-scanner
        run: |
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner

      - name: 扫描依赖漏洞
        run: ./osv-scanner scan -r . --format table

  dependency-review:
    name: dependency-review（依赖变更审查）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  maven-runtime-deps:
    name: 运行时依赖漏洞（Maven）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: 安装 bun
        run: |
          set +e
          npm install -g bun && exit 0
          curl -fsSL https://bun.sh/install | bash && echo "$HOME/.bun/bin" >> $GITHUB_PATH && exit 0
          exit 1

      - name: 安装 pnpm
        run: |
          set +e
          corepack enable && corepack prepare pnpm@latest --activate && exit 0
          npm install -g pnpm && exit 0
          exit 1

      - name: 缓存 web-ui 依赖
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          key: webui-${{ hashFiles('web-ui/bun.lock') }}
          restore-keys: webui-

      - name: 导出运行时依赖清单
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --no-daemon \
            -I .github/scripts/export-runtime-deps.gradle \
            help -Ddeps.out="$PWD/runtime-deps.json"
          python3 -c "import json;d=json.load(open('runtime-deps.json'));print('组件数:',len(d['components']))"

      - name: 扫描已知漏洞
        run: python3 .github/scripts/scan-maven-deps.py runtime-deps.json --fail-on=high
