name: 安全扫描（密钥 / 依赖漏洞 / 依赖变更审查）

# 合并自 secret-scan.yml + dependency-scan.yml + dependency-review.yml：
# - gitleaks：push / PR 全量扫描密钥泄漏
# - osv-scanner：push / PR / 每周定时扫描依赖漏洞（4 个锁文件）
# - dependency-review：仅 PR，审查依赖变更（fail-on-severity: high）

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks（密钥扫描）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for range scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 仅作为检查门禁；不在 PR 里发评论，避免噪声
          GITLEAKS_ENABLE_COMMENTS: false

  osv-scan:
    name: osv-scanner（依赖漏洞）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 获取 osv-scanner
        run: |
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner

      - name: 扫描依赖漏洞
        run: ./osv-scanner scan -r . --format table

  dependency-review:
    name: dependency-review（依赖变更审查）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  maven-runtime-deps:
    name: 运行时依赖漏洞（Maven）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备构建环境
        uses: ./.github/actions/setup-build-env
      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: 缓存 web-ui 依赖
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          key: webui-${{ hashFiles('web-ui/bun.lock') }}
          restore-keys: webui-

      - name: 导出运行时依赖清单
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --no-daemon \
            :app:dependencies --configuration releaseRuntimeClasspath > deps-raw.txt 2>&1 || true
          # 输出里可能混有告警/下载信息，仅保留包含坐标的行由解析脚本处理
          wc -l deps-raw.txt
          python3 .github/scripts/parse-gradle-deps.py deps-raw.txt runtime-deps.json
          python3 -c "import json;d=json.load(open('runtime-deps.json'));print('组件数:',len(d['components']))"

      - name: 扫描已知漏洞
        run: python3 .github/scripts/scan-maven-deps.py runtime-deps.json --fail-on=high

      - name: 保留依赖清单（便于回溯与排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-deps
          path: |
            runtime-deps.json
            deps-raw.txt
          retention-days: 14

  detekt:
    name: detekt（Kotlin 静态分析）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK：主源失败时换发行版回退（与 setup-build-env 同一策略）
      - name: JDK 17（主源）
        id: jdk-primary
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: JDK 17（回退源）
        id: jdk-fallback
        if: steps.jdk-primary.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # detekt-cli：三个来源依次回退，避免单点下载失败中断作业
      - name: 获取 detekt-cli
        shell: bash
        run: |
          set -e
          V=1.23.8
          URLS=(
            "https://github.com/detekt/detekt/releases/download/v$V/detekt-cli-$V-all.jar"
            "https://repo1.maven.org/maven2/io/gitlab/arturbosch/detekt/detekt-cli/$V/detekt-cli-$V-all.jar"
            "https://maven.aliyun.com/repository/public/io/gitlab/arturbosch/detekt/detekt-cli/$V/detekt-cli-$V-all.jar"
          )
          for u in "${URLS[@]}"; do
            echo "尝试：$u"
            if curl -fsSL --retry 2 --connect-timeout 15 -o /tmp/detekt-cli.jar "$u" && [ -s /tmp/detekt-cli.jar ]; then
              echo "已获取 detekt-cli.jar（$(stat -c%s /tmp/detekt-cli.jar) 字节）"
              exit 0
            fi
          done
          echo "::error::detekt-cli.jar 所有来源均失败"
          exit 1

      # 基线只登记既有问题：本作业只对「新增」问题报失败
      - name: Run detekt
        run: |
          java -Xmx2g -jar /tmp/detekt-cli.jar \
            --input app/src/main/java,ai/src/main/java \
            --build-upon-default-config \
            --config .github/detekt/detekt.yml \
            --baseline .github/detekt/detekt-baseline.xml

  lint:
    name: Android Lint（含无障碍规则）
    runs-on: ubuntu-latest
    steps:
      # 编译依赖子模块（material-color-utilities 等），与构建作业保持一致
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # 复用统一构建环境：JDK / Android SDK 均带多源回退
      - name: 准备构建环境
        uses: ./.github/actions/setup-build-env

      # 基线（app/lint-baseline.xml）只登记既有问题：本作业只对「新增」问题报失败
      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: 保留报告（便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: ignore
