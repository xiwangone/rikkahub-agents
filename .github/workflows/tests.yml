name: 单元测试

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 准备构建环境
        uses: ./.github/actions/setup-build-env
      - name: 缓存 Gradle 依赖（libs 变化才重建）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: 缓存 Gradle 构建缓存（固定 key，不堆积）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache
          save-always: true

      - name: 缓存 web-ui 依赖（bun.lock 变化才重建）
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          key: webui-${{ hashFiles('web-ui/bun.lock') }}
          restore-keys: webui-

      - name: 单元测试（:app + :ai + 8 个模块）
        run: |
          chmod +x gradlew
          set -o pipefail
          set +e   # 关掉 -e：失败要自己接管，否则第一次失败就退出、没机会重试
          # `:ai` 是各 provider 共用的基础库，单测此前不在 CI 里，只有本地手动跑 —— 一并纳入
          # 2026-09-30 新增 8 个 0 失败模块（Linux 云端现测 237 例全绿）；
          # common 2026-10-07 纳入：此前标注的 1 flaky 经复核是稳定缺陷（Call.await 未把协程
          #   取消传导到底层请求），已修复并补断言覆盖；
          # local-llm（需 Java 21，CI 为 JDK 17）、oauth（1 本地回环失败）、
          # workspace（1 需外网）暂不纳入，待各自修复后补充。
          for i in 1 2; do
            ./gradlew :app:testDebugUnitTest :ai:testDebugUnitTest :common:testDebugUnitTest :document:testDebugUnitTest :highlight:testDebugUnitTest :llama-cpp:testDebugUnitTest :material3:testDebugUnitTest :search:testDebugUnitTest :speech:testDebugUnitTest :videogen:testDebugUnitTest :web:testDebugUnitTest --parallel --build-cache --configuration-cache 2>&1 | tee unit-test.log
            [ "${PIPESTATUS[0]}" = "0" ] && break
            if [ "$i" = "2" ]; then echo "❌ 两次均失败"; exit 1; fi
            echo "⚠️ 第 $i 次失败（可能是依赖下载超时），10 秒后重试…"; sleep 10
          done

      - name: 上传测试日志（完整 gradle 输出）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit-test.log
          retention-days: 14

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            ai/build/reports/tests/testDebugUnitTest
            document/build/reports/tests/testDebugUnitTest
            highlight/build/reports/tests/testDebugUnitTest
            llama-cpp/build/reports/tests/testDebugUnitTest
            material3/build/reports/tests/testDebugUnitTest
            search/build/reports/tests/testDebugUnitTest
            speech/build/reports/tests/testDebugUnitTest
            videogen/build/reports/tests/testDebugUnitTest
            web/build/reports/tests/testDebugUnitTest
          retention-days: 7
