name: 单元测试

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 准备构建环境
        uses: ./.github/actions/setup-build-env
      - name: 缓存 Gradle 依赖（libs 变化才重建）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: 缓存 Gradle 构建缓存（固定 key，不堆积）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache
          save-always: true

      - name: 缓存 web-ui 依赖（bun.lock 变化才重建）
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          key: webui-${{ hashFiles('web-ui/bun.lock') }}
          restore-keys: webui-

      - name: 单元测试（:app:testDebugUnitTest）
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --parallel --build-cache --configuration-cache

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
