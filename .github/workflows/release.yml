name: 发布 Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag（如 2.45.8；留空=不升级版本，仅用当前版本号重建并刷新 Release 资产）'
        required: false
        type: string
        default: ''
      prerelease:
        description: '标记为预发布（默认 true；正式版取消勾选）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle 依赖（libs 变化才重建）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: 缓存 Gradle 构建缓存（固定 key，不堆积）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache
          save-always: true

      - name: 安装 bun & pnpm
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          npm install -g pnpm

      - name: 解析版本号（填了=发新版；留空=刷新当前版本）
        id: ver
        run: |
          CUR=$(awk -F'"' '/versionName = /{print $2; exit}' app/build.gradle.kts)
          IN="${{ inputs.release_tag }}"
          if [ -z "$IN" ]; then
            echo "tag=$CUR" >> $GITHUB_OUTPUT
            echo "mode=refresh" >> $GITHUB_OUTPUT
            echo "未输入版本号 → 刷新模式（当前 versionName=$CUR，不 bump、不推 master）"
          else
            echo "tag=$IN" >> $GITHUB_OUTPUT
            echo "mode=release" >> $GITHUB_OUTPUT
            echo "输入版本号 $IN → 发版模式（bump 版本号并推送）"
          fi

      - name: 发版时 bump 版本号（versionName/versionCode → release_tag）
        # 仅发版模式执行：构建前把 versionName 设为输入 tag，versionCode 递增
        if: ${{ steps.ver.outputs.mode == 'release' }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          OLD_CODE=$(awk '/versionCode = /{print $3; exit}' app/build.gradle.kts)
          NEW_CODE=$((OLD_CODE + 1))
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$TAG\"/" app/build.gradle.kts
          sed -i "s/versionCode = $OLD_CODE/versionCode = $NEW_CODE/" app/build.gradle.kts
          echo "bump: versionName → $TAG, versionCode $OLD_CODE → $NEW_CODE"
          # 提交版本号推进（发版即改版本，push 触发 build-apk 仅编译验证）
          git config user.name "Release Bot"
          git config user.email "release@rikkahub-agents.local"
          git add app/build.gradle.kts
          git commit -m "chore: bump versionName=$TAG versionCode=$NEW_CODE（release.yml 发版）"
          git push origin master || true

      - name: 固定签名构建 (overwrite-install)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE="$HOME/rikkahub.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "storeFile=$KEYSTORE" >> local.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
          echo "keyAlias=$KEY_ALIAS" >> local.properties
          echo "keyPassword=$KEY_PASSWORD" >> local.properties
          chmod +x gradlew
          # --build-cache 复用本地构建缓存；--configuration-cache 增量配置解析
          ./gradlew :app:assembleRelease --stacktrace --no-daemon --parallel --build-cache --configuration-cache

      - name: 重命名 APK（RikkaHub-Agents-版本号-架构命名）
        run: |
          VER="${{ steps.ver.outputs.tag }}"
          cd app/build/outputs/apk
          for apk in release/*.apk */release/*.apk; do
            [ -f "$apk" ] || continue
            case "$apk" in
              *arm64*) arch="arm64-v8a" ;;
              *x86_64*|*x86-64*) arch="x86_64" ;;
              *universal*) arch="universal" ;;
              *) arch="$(basename "$apk" .apk)" ;;
            esac
            # 保留在 */release/ 目录内重命名，使上传步骤的 */release/*.apk 仍能匹配到
            mv "$apk" "$(dirname "$apk")/RikkaHub-Agents-${VER}-${arch}-release.apk"
          done
          ls -la

      - name: 创建/更新 Release 并上传
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          PRERELEASE="${{ inputs.prerelease }}"
          echo "Release TAG: $TAG (prerelease=$PRERELEASE)"
          # Release 已存在则保留（只刷新资产）；不存在则创建
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # 固定发版说明：简短通用（不列举具体改动）
            NOTES="功能优化与问题修复"
            gh release create "$TAG" \
              --title "🚀 RikkaHub Agents $TAG" \
              --prerelease="$PRERELEASE" \
              --notes "$NOTES"
          else
            echo "Release $TAG 已存在，仅刷新资产"
          fi
          cd app/build/outputs/apk
          for apk in release/*.apk */release/*.apk; do
            [ -f "$apk" ] || continue
            gh release upload "$TAG" "$apk" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
