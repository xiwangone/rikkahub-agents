# 精简配置：只留 bug / 性能 / 异常 / 协程类，关闭风格噪音
build:
  maxIssues: 0
config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  LargeClass:
    # ClaudeProvider 是既有的人型类（>1000 行，远超 600 默认阈值）；拆类风险高于收益，
    # 显式豁免这单个文件（不是关规则），并登记为后续重构项。
    excludes: ['**/providers/claude/ClaudeProvider.kt']
  # Compose 惯例就是多参数/长函数（副作用集中在组合体），这些规则对它系统性误报，
  # 故对 @Composable 标注的函数全部豁免；非 Compose 代码仍按阈值严格执行。
  LongMethod:
    threshold: 120
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 10
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 40
    thresholdInClasses: 25
  CyclomaticComplexMethod:
    threshold: 20
    ignoreAnnotated: ['Composable']

coroutines:
  active: true
empty-blocks:
  active: true
exceptions:
  active: true
naming:
  active: false
performance:
  active: true
potential-bugs:
  active: true
style:
  active: false
