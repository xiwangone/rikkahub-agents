version: 2
updates:
  # Android / Kotlin 依赖
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:40"
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"

  # GitHub Actions 自身
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  # 前端构建工具链（web-ui）
  - package-ecosystem: "npm"
    directory: "/web-ui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
