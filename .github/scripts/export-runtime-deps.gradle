// 把各模块的运行时依赖导出为 CycloneDX JSON，供依赖漏洞扫描使用。
//
// 通过 --init-script 注入，不修改项目自身的构建配置。
// 用法：./gradlew --no-configuration-cache -I <本文件> help -Ddeps.out=<输出路径>
//
// 只取 release 变体的 runtimeClasspath：这些才是随产物分发的依赖。
// 插件 classpath（构建工具自身）不在此列，两者的漏洞含义完全不同。
//
// 两点约束（新版 Gradle）：
//  ① 解析必须在「该项目自身」的评估回调里做——从外部解析别的项目会因缺少
//     独占锁被拒绝（IllegalResolutionException: without an exclusive lock）；
//  ② 复合构建（includeBuild）会让回调在每个子构建各触发一次，需按构建跳过。

def seen = new TreeSet<String>()
def report = []

gradle.afterProject { p ->
    // 只处理最外层主构建，跳过复合构建中的工具构建
    if (p.gradle.parent != null) {
        return
    }

    // 「可解析 + release 运行时 + 非测试」的配置才是分发内容
    def isCandidate = { c ->
        try {
            def n = c.name.toLowerCase()
            c.canBeResolved &&
                n.endsWith("runtimeclasspath") &&
                !n.contains("debug") && !n.contains("test") && !n.contains("androidtest")
        } catch (Exception e) {
            false
        }
    }

    def candidates = p.configurations.findAll(isCandidate)
    if (candidates.isEmpty()) {
        return
    }
    report << "  ${p.path}: 候选配置 ${candidates.size()} 个 -> ${candidates.collect { it.name }.join(', ')}"

    candidates.each { c ->
        try {
            c.resolvedConfiguration.lenientConfiguration.artifacts.each { a ->
                def id = a.moduleVersion.id
                seen << "${id.group}:${id.name}:${id.version}"
            }
        } catch (Exception e) {
            report << "    [跳过] ${p.name}:${c.name} -> ${e.class.simpleName}: ${e.message}"
        }
    }
}

gradle.projectsEvaluated { g ->
    if (g.parent != null) {
        return
    }

    def outputPath = System.getProperty("deps.out")
    if (outputPath == null) {
        println("exportRuntimeDeps: 未指定 -Ddeps.out，跳过导出")
        return
    }

    println("exportRuntimeDeps: 命中 ${report.size()} 个模块配置")
    report.each { println(it) }

    def components = seen.collect { it.split(":", 3) }
    def esc = { String s -> s.replace("\\", "\\\\").replace("\"", "\\\"") }
    def body = components.collect { g2 ->
        def purl = "pkg:maven/${g2[0]}/${g2[1]}@${g2[2]}"
        "{\"type\":\"library\",\"group\":\"${esc(g2[0])}\",\"name\":\"${esc(g2[1])}\",\"version\":\"${esc(g2[2])}\",\"purl\":\"${esc(purl)}\"}"
    }.join(",")

    def out = new File(outputPath)
    if (out.parentFile != null) {
        out.parentFile.mkdirs()
    }
    out.text = '{"bomFormat":"CycloneDX","specVersion":"1.5","version":1,"components":[' + body + ']}'
    println("exportRuntimeDeps: 解析出 ${components.size()} 个组件 -> ${out.absolutePath}")

    // 解析不到任何组件说明本步骤没有生效，必须显式失败，
    // 否则作业会绿色通过，形成「看起来在扫、其实没扫」的假象。
    if (components.isEmpty()) {
        throw new GradleException(
            "未解析到任何运行时依赖；请检查上面的候选配置输出（预期含 releaseRuntimeClasspath）"
        )
    }
}
